<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新 K100 · 工作台连接</title>
<style>body{font:16px/1.7 system-ui;max-width:860px;margin:48px auto;color:#242633;background:#fafbff}section{background:white;padding:24px;margin:20px 0;border:1px solid #dedfeb;border-radius:12px}input,select,textarea,button{font:inherit;padding:10px;box-sizing:border-box}input,select,textarea{display:block;width:100%;margin:8px 0 18px;border:1px solid #bbb;border-radius:6px}button{cursor:pointer;margin:6px 8px 6px 0}article{padding:16px 0;border-top:1px solid #ddd}small{color:#555}#notice{white-space:pre-wrap}a{color:#484ad5}</style>
<a href="/">← 返回项目管理工作台</a><h1>新 K100 连接</h1><p>在客户作战室关联准确主体后，保存实际进展会自动写入新 K100，并保留同步回执。</p>
<section><h2>连接状态</h2><p id="status">读取中…</p><details><summary>更新本机登录会话</summary><p>登录失效时更新授权会话。凭据仅保存到本机钥匙串。</p><form id="connect"><label>授权会话<input id="credential" type="password" autocomplete="off" required></label><button>验证并保存连接</button></form></details></section>
<section><h2>验证工作台自动同步</h2><p>保存一条独立的技术测试进展，后台自动写入普通备注。不会将它计作真实业务跟进或刷新保护期。</p><button id="customers">读取我的客户</button><form id="test"><label>测试客户<select id="customer" required><option value="">请先读取客户</option></select></label><label>本地测试进展<textarea id="content" rows="4" required>【技术接入测试｜非真实客户跟进】验证工作台保存进展后，由后台自动写入新 K100 并回读操作回执。本条为普通备注，不代表真实业务沟通，不用于刷新主体保护期。</textarea></label><button id="save">保存测试进展（自动同步）</button></form><p id="notice" role="status"></p></section>
<section><h2>同步回执</h2><button id="refresh">刷新回执</button><div id="events"></div><small>已核实的回执包含操作类型与保护期标记；当前 CRM 操作记录接口不回显备注全文。</small></section>
<script src="/k100-connection.js"></script></html>
